<div class="container-admin">
  
  <div class="header-admin">
    <button type="button" class="btn-voltar" (click)="voltarHome()">← Voltar</button>
    <h2 class="title-admin">Cadastro de {{ tipoItem === 'P' ? 'Produtos' : 'Serviços' }}</h2>
    <div style="width: 80px;"></div>
  </div>

  <div class="tabs-tipo">
    <button [class.active]="tipoItem === 'P'" (click)="alternarTipo('P')"> Produtos</button>
    <button [class.active]="tipoItem === 'S'" (click)="alternarTipo('S')"> Serviços</button>
  </div>

  <div class="card-form">
    <div class="form-grid">
      
      <div class="form-group">
        <label>NOME DO ITEM:</label>
        <input type="text" [(ngModel)]="nomeItem" placeholder="Ex: Limpeza de Pele / Creme" class="input-custom">
      </div>

      <!-- CAMPO DE SELEÇÃO DE CATEGORIA VINCULADO AO BANCO -->
   <div class="form-group">
  <label>CATEGORIA:</label>
  <select [(ngModel)]="idCategoriaSelecionada" class="input-custom">
    <option [ngValue]="null" disabled>Selecione uma categoria...</option>
    <option *ngFor="let cat of categorias" [value]="cat.idCategoria || cat.idcategoria || cat.id">
      {{ cat.nomeCategoria || cat.nome || cat.categoria }}
    </option>
  </select>
</div>
      <div class="form-group full-width">
        <label>PREÇO (R$):</label>
        <input type="number" [(ngModel)]="preco" placeholder="0.00" class="input-custom">
      </div>

      <div class="form-group full-width">
        <label>DESCRIÇÃO:</label>
        <textarea [(ngModel)]="descricao" rows="3" placeholder="Detalhes do item..." class="input-custom"></textarea>
      </div>

    </div>

    <div class="form-actions">
      <button class="btn-salvar" (click)="salvarItem()">Cadastrar {{ tipoItem === 'P' ? 'Produto' : 'Serviço' }}</button>
    </div>
  </div>

  <div class="table-wrapper" *ngIf="itensFiltrados.length > 0">
    <table class="admin-table">
      <thead>
        <tr>
          <th style="width: 70px;">ID</th>
          <th>NOME</th>
          <th style="width: 160px;">CATEGORIA</th>
          <th style="width: 120px;">PREÇO</th>
          <th>DESCRIÇÃO</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of itensFiltrados">
          <td>#{{ obterIdItem(item) }}</td>
          <td>{{ obterNomeItem(item) }}</td>
          <td>
            <span class="badge-cat">{{ obterNomeCategoria(item) }}</span>
          </td>
          <td>R$ {{ obterPrecoItem(item) | number:'1.2-2' }}</td>
          <td>{{ obterDescricaoItem(item) }}</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
