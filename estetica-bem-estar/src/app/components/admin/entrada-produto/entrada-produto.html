<section class="container-estoque container-reduzido">
  <h2>Entrada de Produtos</h2>

  <!-- Mensagens de Feedback -->
  <div *ngIf="mensagemSucesso" class="alert alert-sucesso">
    {{ mensagemSucesso }}
  </div>
  <div *ngIf="mensagemErro" class="alert alert-erro">
    {{ mensagemErro }}
  </div>

  <form (ngSubmit)="registrarEntrada()" class="form-entrada">
    
    <div class="form-group">
      <label for="idItem">PRODUTO *</label>
      <select 
        id="idItem" 
        [(ngModel)]="entrada.idItem" 
        name="idItem" 
        (change)="aoSelecionarProduto()" 
        class="form-control" 
        required>
        <option [value]="0" disabled>-- Selecione um Produto --</option>
        <option *ngFor="let prod of produtosDisponiveis" [value]="prod.idItem || prod.id">
          ID {{ prod.idItem || prod.id }} - {{ prod.nomeItem || prod.nome }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="quantidadeEntrada">QUANTIDADE RECEBIDA *</label>
      <input 
        type="number" 
        id="quantidadeEntrada" 
        [(ngModel)]="entrada.quantidadeEntrada" 
        name="quantidadeEntrada" 
        min="1" 
        class="form-control" 
        required 
      />
    </div>

    <div class="form-group">
      <label for="unidade">UNIDADE DE MEDIDA *</label>
      <select id="unidade" [(ngModel)]="entrada.unidade" name="unidade" class="form-control" required>
        <option value="UN">UN - Unidade</option>
        <option value="CX">CX - Caixa</option>
        <option value="KG">KG - Quilo</option>
        <option value="ML">ML - Mililitros</option>
      </select>
    </div>

    <div class="form-group">
      <label for="valorUnitarioEntrada">
        VALOR UNITÁRIO DE CUSTO (R$) *
      </label>
      <input 
        type="number" 
        id="valorUnitarioEntrada" 
        [(ngModel)]="entrada.valorUnitarioEntrada" 
        name="valorUnitarioEntrada" 
        step="0.01" 
        min="0.01" 
        placeholder="Ex: 45.00" 
        class="form-control" 
        required 
      />
    </div>

    <div class="form-group">
      <label for="dataEntradaProduto">DATA DA ENTRADA *</label>
      <input 
        type="date" 
        id="dataEntradaProduto" 
        [(ngModel)]="entrada.dataEntradaProduto" 
        name="dataEntradaProduto" 
        class="form-control" 
        required 
      />
    </div>

    <!-- BOTÕES: O botão bloqueia de verdade quando 'enviando' for true -->
    <div class="div-btns">
      <button type="button" class="btn-voltar" (click)="voltar()">Voltar</button>
      <button type="submit" class="btn-salvar" [disabled]="enviando">
        {{ enviando ? 'Gravando...' : 'Confirmar Entrada' }}
      </button>
    </div>
  </form>

  <!-- Histórico Recente -->
  <div class="box-historico" *ngIf="historicoEntradas.length > 0">
    <h3 class="section-title">Histórico de Entradas</h3>

    <table class="tabela-estoque">
      <thead>
        <tr>
          <th>ID Item</th>
          <th>Data</th>
          <th>Qtd. Entrada</th>
          <th>Unidade</th>
          <th>Custo Unit.</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let h of historicoEntradas">
          <td>{{ h.idItem }}</td>
          <td>{{ h.dataEntradaProduto }}</td>
          <td style="color: green; font-weight: bold;">+{{ h.quantidadeEntrada }}</td>
          <td>{{ h.unidade }}</td>
          <td>R$ {{ h.valorUnitarioEntrada | number:'1.2-2' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
