<section class="container-estoque">
  <h2>Consulta de Estoque</h2>

  <div class="box-pesquisa">
    <label for="termoBusca">PESQUISAR PRODUTO</label>
    <input 
      type="text" 
      id="termoBusca" 
      [(ngModel)]="termoBusca" 
      (ngModelChange)="filtrarProdutos()" 
      placeholder="Digite o nome ou ID..." 
      class="input-busca"
    />
  </div>

  <div class="div-btns">
    <button type="button" class="btn-limpar" (click)="limparFiltro()">Limpar Filtro</button>
    <button type="button" class="btn-voltar" (click)="voltarMenu()">Voltar ao Menu</button>
  </div>

  <h3>Itens em Estoque</h3>

  <table class="tabela-estoque" *ngIf="itensFiltrados.length > 0; else semEstoque">
    <thead>
      <tr>
        <th>ID</th>
        <th>Produto</th>
        <th>Qtd. Atual</th>
        <th>Unidade</th>
        <th>Preço Venda</th>
        <th>Situação</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of itensFiltrados">
        <td>{{ item.id }}</td>
        <td>{{ item.produto }}</td>
        <td [style.color]="item.qtdAtual > 0 ? 'green' : 'red'">{{ item.qtdAtual }}</td>
        <td>{{ item.unidade }}</td>
        <td>R$ {{ item.precoVenda | number:'1.2-2' }}</td>
        <td [style.color]="item.qtdAtual > 0 ? 'green' : 'red'">
          <strong>{{ item.situacao }}</strong>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #semEstoque>
    <p class="empty-message">Nenhum produto encontrado com o filtro inserido.</p>
  </ng-template>
</section>
